apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: ruler-alerts
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana: primary
  folderRef: mimir
  interval: 1m
  rules:
  - uid: mimirrulertoomanyfailedpushes
    title: MimirRulerTooManyFailedPushes
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "100 * (\n# Here it matches on empty \"reason\" for backwards compatibility,\
          \ with when the metric didn't have this label.\nsum by (cluster, namespace,\
          \ pod) (rate(cortex_ruler_write_requests_failed_total{reason=~\"(error|^$)\"\
          }[1m]))\n  /\nsum by (cluster, namespace, pod) (rate(cortex_ruler_write_requests_total[1m]))\n\
          ) > 1\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      severity: critical
    annotations:
      message: Mimir Ruler {{ "{{" }} $labels.pod }} in {{ "{{" }} $labels.cluster
        }}/{{ "{{" }} $labels.namespace }} is experiencing {{ "{{" }} printf "%.2f"
        $value }}% write (push) errors.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulertoomanyfailedpushes
  - uid: mimirrulertoomanyfailedqueries
    title: MimirRulerTooManyFailedQueries
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "100 * (\n# Here it matches on empty \"reason\" for backwards compatibility,\
          \ with when the metric didn't have this label.\nsum by (cluster, namespace,\
          \ pod) (rate(cortex_ruler_queries_failed_total{reason=~\"(error|^$)\"}[1m]))\n\
          \  /\nsum by (cluster, namespace, pod) (rate(cortex_ruler_queries_total[1m]))\n\
          ) > 1\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      severity: critical
    annotations:
      message: Mimir Ruler {{ "{{" }} $labels.pod }} in {{ "{{" }} $labels.cluster
        }}/{{ "{{" }} $labels.namespace }} is experiencing {{ "{{" }} printf "%.2f"
        $value }}% errors while evaluating rules.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulertoomanyfailedqueries
  - uid: mimirrulermissedevaluations
    title: MimirRulerMissedEvaluations
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "100 * (\nsum by (cluster, namespace, pod, rule_group) (rate(cortex_prometheus_rule_group_iterations_missed_total[1m]))\n\
          \  /\nsum by (cluster, namespace, pod, rule_group) (rate(cortex_prometheus_rule_group_iterations_total[1m]))\n\
          ) > 1\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      severity: warning
    annotations:
      message: Mimir Ruler {{ "{{" }} $labels.pod }} in {{ "{{" }} $labels.cluster
        }}/{{ "{{" }} $labels.namespace }} is experiencing {{ "{{" }} printf "%.2f"
        $value }}% missed iterations for the rule group {{ "{{" }} $labels.rule_group
        }}.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulermissedevaluations
  - uid: mimirrulerfailedringcheck
    title: MimirRulerFailedRingCheck
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "sum by (cluster, namespace, job) (rate(cortex_ruler_ring_check_errors_total[1m]))\n\
          \   > 0\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      severity: critical
    annotations:
      message: Mimir Rulers in {{ "{{" }} $labels.cluster }}/{{ "{{" }} $labels.namespace
        }} are experiencing errors when checking the ring for rule group ownership.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulerfailedringcheck
  - uid: mimirrulerremoteevaluationfailing
    title: MimirRulerRemoteEvaluationFailing
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "(\n  sum by (cluster, namespace) (rate(cortex_request_duration_seconds_count{status_code=~\"\
          5..\", route=\"/httpgrpc.HTTP/Handle\", job=~\".*/(ruler-query-frontend.*)\"\
          }[5m]))\n  /\n  sum by (cluster, namespace) (rate(cortex_request_duration_seconds_count{route=\"\
          /httpgrpc.HTTP/Handle\", job=~\".*/(ruler-query-frontend.*)\"}[5m]))\n)\
          \ * 100 > 1\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      histogram: classic
      severity: warning
    annotations:
      message: Mimir rulers in {{ "{{" }} $labels.cluster }}/{{ "{{" }} $labels.namespace
        }} are failing to perform {{ "{{" }} printf "%.2f" $value }}% of remote evaluations
        through the ruler-query-frontend.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulerremoteevaluationfailing
  - uid: mimirrulerremoteevaluationfailing
    title: MimirRulerRemoteEvaluationFailing
    condition: A
    execErrState: Error
    noDataState: OK
    data:
    - refId: A
      queryType: promql
      relativeTimeRange:
        from: 60
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: "(\n  sum by (cluster, namespace) (histogram_count(rate(cortex_request_duration_seconds{status_code=~\"\
          5..\", route=\"/httpgrpc.HTTP/Handle\", job=~\".*/(ruler-query-frontend.*)\"\
          }[5m])))\n  /\n  sum by (cluster, namespace) (histogram_count(rate(cortex_request_duration_seconds{route=\"\
          /httpgrpc.HTTP/Handle\", job=~\".*/(ruler-query-frontend.*)\"}[5m])))\n\
          ) * 100 > 1\n"
        interval: ''
        legendFormat: ''
        refId: A
    for: 5m
    labels:
      histogram: native
      severity: warning
    annotations:
      message: Mimir rulers in {{ "{{" }} $labels.cluster }}/{{ "{{" }} $labels.namespace
        }} are failing to perform {{ "{{" }} printf "%.2f" $value }}% of remote evaluations
        through the ruler-query-frontend.
      runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulerremoteevaluationfailing
